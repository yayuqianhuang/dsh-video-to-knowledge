name: smoke

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
      # mysql2 为 optionalDependencies，安装失败不影响 mock-only 冒烟测试
      - run: npm install
      - run: npm test
